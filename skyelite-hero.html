<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyElite — Premium. Accessible.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen bg-gray-50">
    <!-- Hero Section -->
    <section class="relative h-screen overflow-hidden">
      <!-- Video Background -->
      <video
        class="absolute inset-0 w-full h-full object-cover"
        style="height: 100vh;"
        autoplay
        muted
        loop
        playsinline
      >
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_091828_e240eb17-6edc-4129-ad9d-98678e3fd238.mp4" type="video/mp4" />
      </video>

      <!-- Content Wrapper -->
      <div class="relative h-full flex flex-col">
        <!-- Navigation Bar -->
        <nav class="max-w-7xl mx-auto w-full px-8 py-6 flex items-center justify-between">
          <a href="#" class="text-2xl font-semibold text-gray-900">SkyElite</a>

          <!-- Desktop Menu -->
          <div class="hidden md:flex items-center space-x-8">
            <a href="#" class="text-gray-900 hover:text-gray-700 transition-colors">Start</a>
            <a href="#" class="text-gray-900 hover:text-gray-700 transition-colors">Story</a>
            <a href="#" class="text-gray-900 hover:text-gray-700 transition-colors">Rates</a>
            <a href="#" class="text-gray-900 hover:text-gray-700 transition-colors">Benefits</a>
            <a href="#" class="text-gray-900 hover:text-gray-700 transition-colors">FAQ</a>
          </div>

          <!-- Mobile Hamburger -->
          <button id="menu-btn" class="md:hidden text-gray-900 p-2" aria-label="Toggle menu">
            <i data-lucide="menu" id="icon-menu" class="w-6 h-6"></i>
            <i data-lucide="x" id="icon-close" class="w-6 h-6 hidden"></i>
          </button>
        </nav>

        <!-- Mobile Menu Dropdown -->
        <div class="md:hidden px-8">
          <div id="mobile-menu" class="hidden bg-white/95 backdrop-blur rounded-2xl shadow-lg p-6 flex-col space-y-4">
            <a href="#" class="block text-gray-900 hover:text-gray-700 transition-colors">Start</a>
            <a href="#" class="block text-gray-900 hover:text-gray-700 transition-colors">Story</a>
            <a href="#" class="block text-gray-900 hover:text-gray-700 transition-colors">Rates</a>
            <a href="#" class="block text-gray-900 hover:text-gray-700 transition-colors">Benefits</a>
            <a href="#" class="block text-gray-900 hover:text-gray-700 transition-colors">FAQ</a>
          </div>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 flex items-center justify-center">
          <div class="text-center px-8 -mt-80">
            <p class="text-sm font-semibold text-gray-600 tracking-wider mb-4 uppercase">Private Jets</p>
            <h1 class="text-6xl md:text-7xl lg:text-8xl font-normal text-gray-500 leading-none tracking-tighter">Premium.</h1>
            <h1 class="text-6xl md:text-7xl lg:text-8xl font-normal leading-none tracking-tighter" style="color: #202A36; margin-top: -12px;">Accessible.</h1>
            <p class="text-lg md:text-xl text-gray-600 mb-6 max-w-2xl mx-auto mt-6">Your dedication deserves recognition.</p>
            <div class="flex gap-4 justify-center">
              <a href="#" class="px-4 py-2 rounded-full bg-gray-300 text-gray-800 font-medium hover:bg-gray-400 transition-colors">Discover</a>
              <a href="#" class="px-4 py-2 rounded-full text-white font-medium transition-colors" style="background-color: #202A36;" onmouseover="this.style.backgroundColor='#1a2229'" onmouseout="this.style.backgroundColor='#202A36'">Book Now</a>
            </div>
          </div>
        </main>
      </div>
    </section>
  </div>

  <script>
    lucide.createIcons();
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const iconMenu = document.getElementById('icon-menu');
    const iconClose = document.getElementById('icon-close');
    menuBtn.addEventListener('click', () => {
      const isHidden = mobileMenu.classList.contains('hidden');
      if (isHidden) {
        mobileMenu.classList.remove('hidden');
        mobileMenu.classList.add('flex');
        iconMenu.classList.add('hidden');
        iconClose.classList.remove('hidden');
      } else {
        mobileMenu.classList.add('hidden');
        mobileMenu.classList.remove('flex');
        iconMenu.classList.remove('hidden');
        iconClose.classList.add('hidden');
      }
    });
  </script>

                  </div>
                </div>
              </main>
            </div>
          </section>
        </div>
      );
    }
  -->
</body>
</html>
